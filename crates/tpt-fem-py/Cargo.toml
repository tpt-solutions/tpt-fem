[package]
name = "tpt-fem-py"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Python bindings for the tpt-fem core (maturin, dev-only this pass)."
repository = "https://github.com/tpt-solutions/tpt-fem"
homepage = "https://github.com/tpt-solutions/tpt-fem"
readme = "README.md"
keywords = ["python", "pyo3", "fem", "bindings", "finite-element"]
categories = ["science", "api-bindings", "simulation"]

[lib]
name = "tpt_fem"
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-fem = { version = "0.1.0", path = "../tpt-fem", features = ["topopt", "plasticity", "hyperelastic", "porous", "fluid", "composite", "dynamic", "contact", "coupling"] }
pyo3 = { version = "0.23", features = ["extension-module"] }
# Optional GPU acceleration (wgpu); build with `maturin develop --features gpu`.
tpt-fem-gpu = { version = "0.1.0", path = "../tpt-fem-gpu", optional = true }

[features]
default = []
# Exposes `gpu_adapter()` and `gpu_solve_cg(...)` (GPU-resident PCG).
gpu = ["dep:tpt-fem-gpu"]
