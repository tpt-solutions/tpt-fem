[package]
name = "tpt-fem-py"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Python bindings for the tpt-fem core (maturin, dev-only this pass)."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["python", "pyo3", "fem", "bindings", "finite-element"]
categories = ["science", "api-bindings", "simulation"]

[lib]
name = "tpt_fem_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-fem = { workspace = true }
pyo3 = { version = "0.22", features = ["extension-module"] }

[features]
default = []
