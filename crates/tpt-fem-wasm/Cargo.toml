[package]
name = "tpt-fem-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "In-browser (WebAssembly) topology-optimization demo for tpt-fem (wasm-pack, dev-only)."
repository = "https://github.com/tpt-solutions/tpt-fem"
homepage = "https://github.com/tpt-solutions/tpt-fem"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-fem-topopt = { version = "0.1.1", path = "../tpt-fem-topopt" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
