[package]
name = "tpt-fem"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Umbrella crate re-exporting tpt-fem core crates behind Cargo features."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["finite-element", "fem", "scientific-computing", "simulation", "hpc"]
categories = ["science", "mathematics", "simulation"]

[dependencies]
thiserror = "1"
toml = "0.8"
tpt-fem-quadrature = { workspace = true, optional = true }
tpt-fem-element = { workspace = true, optional = true }
tpt-fem-mesh = { workspace = true, optional = true }
tpt-fem-sparse = { workspace = true, optional = true }
tpt-fem-assembly = { workspace = true, optional = true }
tpt-fem-thermal = { workspace = true, optional = true }
tpt-fem-io-vtk = { workspace = true, optional = true }
tpt-fem-elasticity = { workspace = true, optional = true }
tpt-fem-solve = { workspace = true, optional = true }
tpt-fem-eigen = { workspace = true, optional = true }
tpt-fem-io-abaqus = { workspace = true, optional = true }
tpt-fem-io-exodus = { workspace = true, optional = true }
tpt-fem-mesh-gen = { workspace = true, optional = true }
tpt-fem-dofmap = { workspace = true, optional = true }
tpt-fem-dynamic = { workspace = true, optional = true }
tpt-fem-plasticity = { workspace = true, optional = true }
tpt-fem-hyperelastic = { workspace = true, optional = true }
tpt-fem-composite = { workspace = true, optional = true }
tpt-fem-porous = { workspace = true, optional = true }
tpt-fem-contact = { workspace = true, optional = true }
tpt-fem-fluid = { workspace = true, optional = true }
tpt-fem-coupling = { workspace = true, optional = true }
tpt-fem-modal = { workspace = true, optional = true }
tpt-fem-topopt = { workspace = true, optional = true }
tpt-fem-amr = { workspace = true, optional = true }

[features]
default = ["quadrature", "element", "mesh", "sparse", "assembly", "thermal", "io-vtk", "elasticity", "solve", "eigen", "io-abaqus", "io-exodus", "mesh-gen"]
# Phase 12 (advanced materials / contact / multiphysics) crates are experimental
# and deliberately NOT enabled by default.
quadrature = ["dep:tpt-fem-quadrature"]
element = ["dep:tpt-fem-element"]
mesh = ["dep:tpt-fem-mesh"]
sparse = ["dep:tpt-fem-sparse"]
assembly = ["dep:tpt-fem-assembly"]
thermal = ["dep:tpt-fem-thermal"]
io-vtk = ["dep:tpt-fem-io-vtk"]
elasticity = ["dep:tpt-fem-elasticity"]
solve = ["dep:tpt-fem-solve"]
eigen = ["dep:tpt-fem-eigen"]
io-abaqus = ["dep:tpt-fem-io-abaqus"]
io-exodus = ["dep:tpt-fem-io-exodus"]
mesh-gen = ["dep:tpt-fem-mesh-gen"]
dofmap = ["dep:tpt-fem-dofmap"]
dynamic = ["dep:tpt-fem-dynamic"]
plasticity = ["dep:tpt-fem-plasticity"]
hyperelastic = ["dep:tpt-fem-hyperelastic"]
composite = ["dep:tpt-fem-composite"]
porous = ["dep:tpt-fem-porous"]
contact = ["dep:tpt-fem-contact"]
fluid = ["dep:tpt-fem-fluid"]
coupling = ["dep:tpt-fem-coupling"]
modal = ["dep:tpt-fem-modal"]
topopt = ["dep:tpt-fem-topopt"]
# Adaptive mesh refinement (quadtree h-refinement Poisson solver with
# hanging-node elimination and ZZ error estimation).
amr = ["dep:tpt-fem-amr"]
# Optional MUMPS/UMFPACK sparse-direct backend (large-scale solves). Forwards
# to `tpt-fem-sparse`'s `russell` feature; requires the SuiteSparse/MUMPS
# toolchain (see `russell_sparse`), so it is never enabled by default.
russell = ["tpt-fem-sparse/russell"]

[lints]
workspace = true

# Advanced multi-crate showcases. Each chains several constituent crates into
# an end-to-end physics pipeline with verification against analytical results.
[[example]]
name = "thermoelastic_plate_showcase"
path = "examples/thermoelastic_plate_showcase.rs"
required-features = ["coupling", "thermal", "io-vtk", "mesh", "sparse", "elasticity", "assembly"]

[[example]]
name = "contact_column_showcase"
path = "examples/contact_column_showcase.rs"
required-features = ["contact", "mesh", "elasticity", "assembly", "sparse"]

[[example]]
name = "cantilever_dynamics_showcase"
path = "examples/cantilever_dynamics_showcase.rs"
required-features = ["modal", "dynamic", "eigen", "mesh", "elasticity", "assembly", "sparse"]


