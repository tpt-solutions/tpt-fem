[package]
name = "tpt-fem-sparse"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "FEM-specific COO/CSR assembly adapter with a tpt-math-backed solve."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["sparse-matrix", "csr", "linear-algebra", "fem", "solver"]
categories = ["mathematics", "science", "algorithms"]

[dependencies]
tpt-math-linalg-dense = { git = "https://github.com/tpt-solutions/tpt-math", package = "tpt-math-linalg-dense" }
# Optional sparse-direct backend. `russell_sparse` wraps MUMPS/UMFPACK and its
# build downloads + compiles SuiteSparse (Fortran/C toolchain required); it is
# therefore *not* enabled by default and only compiled where that toolchain
# exists. See https://github.com/cpmech/russell for install instructions.
russell_sparse = { version = "2.8", optional = true }
russell_lab = { version = "2", optional = true }

[features]
default = []
# Sparse-direct (MUMPS/UMFPACK) solve backend for large-scale problems.
russell = ["russell_sparse", "russell_lab"]

[lints]
workspace = true

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "dense_solve"
harness = false

