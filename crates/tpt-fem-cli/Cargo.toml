[package]
name = "tpt-fem-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line driver for the tpt-fem core (solve / mesh info / mesh convert)."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["finite-element", "fem", "simulation", "cli", "command-line"]
categories = ["command-line-utilities", "science", "simulation"]

[[bin]]
name = "tpt-fem"
path = "src/main.rs"

[dependencies]
tpt-fem = { workspace = true, features = ["amr"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[features]
default = []

[lints]
workspace = true

