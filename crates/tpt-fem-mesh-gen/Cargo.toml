[package]
name = "tpt-fem-mesh-gen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Native (dependency-free) 3D tetrahedral mesh generation for tpt-fem: Delaunay tetrahedralisation and structured box meshing."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["mesh-generation", "delaunay", "tetrahedral", "fem", "mesh"]
categories = ["science", "algorithms", "data-structures"]

[dependencies]
tpt-fem-mesh = { workspace = true }

[features]
default = []

[lints]
workspace = true

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "delaunay"
harness = false

