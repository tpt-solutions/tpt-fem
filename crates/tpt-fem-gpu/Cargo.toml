[package]
name = "tpt-fem-gpu"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
description = "Optional GPU (wgpu compute) acceleration for tpt-fem: CSR matvec and mixed-precision conjugate gradients."
repository = "https://github.com/tpt-solutions/tpt-fem"
homepage = "https://github.com/tpt-solutions/tpt-fem"
readme = "README.md"
publish = false

[dependencies]
tpt-fem-sparse = { version = "0.1.0", path = "../tpt-fem-sparse" }
wgpu = "24"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
