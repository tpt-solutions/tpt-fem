name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Nightly run so the heavy `#[ignore]`d 3-D MMS convergence test
  # (`mms_3d_converges`) actually executes instead of never running in CI.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fail-fast manifest sanity check. Runs `cargo metadata` (which fully parses
  # every workspace manifest in seconds) plus the workspace-membership drift
  # test BEFORE the slower build/test/clippy matrix, so a manifest-level break
  # (missing member, missing [workspace.dependencies] entry, dangling optional
  # dependency) surfaces immediately instead of after a full compile.
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo metadata parses cleanly
        run: cargo metadata --no-deps --format-version 1 > /dev/null
      - name: workspace membership / dependency drift test
        run: cargo test -p tpt-fem --test manifest_drift

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `--all-features` pulls in `tpt-fem-sparse/russell`, which needs the
      # OpenBLAS/LAPACK C headers (`cblas.h`, `lapacke.h`) to compile its FFI
      # shim; ubuntu-latest doesn't ship them by default.
      - name: Install OpenBLAS/LAPACK/SuiteSparse dev headers
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapacke-dev libsuitesparse-dev
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    needs: [manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenBLAS/LAPACK/SuiteSparse dev headers
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapacke-dev libsuitesparse-dev
      - run: cargo test --workspace --all-features

  docs:
    needs: [manifest]
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenBLAS/LAPACK/SuiteSparse dev headers
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapacke-dev libsuitesparse-dev
      - run: cargo doc --workspace --no-deps --all-features

  # wasm32 target check. The pure-math crates (quadrature/element/mesh) must
  # build cleanly for wasm32. The `tpt-fem-sparse` crate is allowed to
  # soft-fail: its default solve backend is an in-house dense LU with no
  # external dependencies, but the optional `russell` feature pulls in a
  # native SuiteSparse/MUMPS toolchain that is not expected to build for
  # wasm32 out of the box.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm (hard-fail core crates)
        run: |
          for c in tpt-fem-quadrature tpt-fem-element tpt-fem-mesh; do
            cargo build -p $c --target wasm32-unknown-unknown
          done
      - name: wasm (soft-fail sparse)
        run: cargo build -p tpt-fem-sparse --target wasm32-unknown-unknown || true

  # Track criterion benchmark output over time. The dense-LU (`tpt-fem-sparse`)
  # and Delaunay/box-mesh (`tpt-fem-mesh-gen`) benches are run and their results
  # uploaded as an artifact so regressions can be compared across runs (a
  # github-action-benchmark-style PR dashboard is a future enhancement). Uses
  # default features only — the optional `russell` sparse-direct backend needs
  # the SuiteSparse/MUMPS toolchain and is not built here.
  #
  # Criterion's defaults (3 s warm-up + 5 s measurement per benchmark, 100
  # samples) add up to many minutes across all benchmarks on shared CI runners.
  # The CLI flags below bound each benchmark to ~2 s total while keeping enough
  # samples for a usable baseline comparison between runs. The `--bench`
  # selectors are required: without them `cargo bench` also runs each crate's
  # unit tests in bench mode, whose libtest harness rejects criterion flags.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run criterion benchmarks
        run: |
          cargo bench -p tpt-fem-sparse --bench dense_solve \
            -p tpt-fem-mesh-gen --bench delaunay -- \
            --warm-up-time 0.5 --measurement-time 1.5 --sample-size 20
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: criterion-benchmarks
          path: target/criterion

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: compile-only fuzz targets
        run: |
          cd fuzz
          for t in exodus_decode gmsh_import abaqus_inp exodus_roundtrip vtk_import; do
            cargo +nightly build --bin $t
          done

  # Actually execute the fuzz targets (the `fuzz-build` job only compiles them).
  # Runs on the nightly schedule / manual dispatch, with the corpus and crash
  # artifacts cached between runs so seeds and findings accumulate. Each target
  # gets a bounded wall-clock budget.
  fuzz-run:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Cache fuzz corpus and artifacts
        uses: actions/cache@v4
        with:
          path: |
            fuzz/corpus
            fuzz/artifacts
          key: fuzz-corpus-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-
      - name: Run fuzz targets
        run: |
          cd fuzz
          for t in exodus_decode gmsh_import abaqus_inp exodus_roundtrip vtk_import; do
            cargo +nightly fuzz run $t -- -max_total_time=120 -timeout=10
          done


  # No no_std job: every tpt-fem-* crate needs std (Vec/HashMap-backed mesh
  # and sparse-matrix data structures, file I/O for mesh import), unlike
  # tpt-math's no_std=true substrate crates. Revisit only if a future crate
  # here declares no_std = true in tpt-rust-map/registry.toml.

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Heavy `#[ignore]`d 3-D MMS convergence test (`mms_3d_converges`) — runs on
  # the nightly schedule (and manually) rather than in the fast `test` job, so
  # it actually gets exercised instead of bit-rotting.
  mms-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p tpt-fem-thermal -- --ignored mms_3d_converges
