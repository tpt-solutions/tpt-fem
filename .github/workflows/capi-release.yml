name: C API release

# Builds prebuilt tpt-fem-capi libraries (shared + static) and the C header for
# Linux, macOS and Windows. Runs on manual dispatch, or on a `capi-v*` tag, in
# which case the archives are also attached to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["capi-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/tpt-fem-capi
      - name: Build
        working-directory: crates/tpt-fem-capi
        run: cargo build --release
      - name: Package
        shell: bash
        run: |
          out="tpt-fem-capi-${{ matrix.name }}"
          mkdir -p "$out/include" "$out/lib"
          cp crates/tpt-fem-capi/include/tpt_fem.h "$out/include/"
          cp LICENSE-MIT LICENSE-APACHE crates/tpt-fem-capi/README.md "$out/"
          cd crates/tpt-fem-capi/target/release
          for f in tpt_fem_capi.dll tpt_fem_capi.dll.lib tpt_fem_capi.lib libtpt_fem_capi.so libtpt_fem_capi.dylib libtpt_fem_capi.a; do
            [ -f "$f" ] && cp "$f" "$GITHUB_WORKSPACE/$out/lib/"
          done
          cd "$GITHUB_WORKSPACE"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$out.zip" "$out" > /dev/null
            echo "ASSET=$out.zip" >> "$GITHUB_ENV"
          else
            tar czf "$out.tar.gz" "$out"
            echo "ASSET=$out.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tpt-fem-capi-${{ matrix.name }}
          path: ${{ env.ASSET }}
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/capi-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
